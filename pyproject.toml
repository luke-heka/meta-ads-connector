[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-ads-connect"
version = "0.1.0"
description = "Connect Claude to Meta Ads: install the official Ads CLI, mint a system user token, register the official Ads MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Playwright is only needed to mint a token in a browser. Everything else —
# probe, doctor, install, store-token, register-mcp, repair-assets — is stdlib only.
mint = ["playwright>=1.40"]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
meta-ads-connect = "meta_ads_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_ads_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
# Playwright is an optional extra and is not installed in the default dev env.
[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true
